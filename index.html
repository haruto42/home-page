<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>haruto42</title>
<style>
	* {
		box-sizing: border-box;
	}

	body {
		font-family: sans-serif;
		max-width: 360px;
		margin: 0 auto;
		padding: 2rem 1rem;
		display: flex;
		flex-direction: column;
		gap: 0.6rem;
	}

	h2 {
		font-size: 1rem;
		margin: 1rem 0 0;
		color: #555;
		border-bottom: 2px solid #4a90d9;
		padding-bottom: 0.3rem;
	}

	a.link,
	button {
		display: block;
		font-size: 1rem;
		padding: 0.8rem;
		text-align: center;
		text-decoration: none;
		color: #1a4fa0;
		background: #eef3fb;
		border: 1px solid #c9d8ee;
		border-radius: 8px;
	}

	input {
		font-size: 1rem;
		padding: 0.6rem;
	}

	.note {
		font-size: 0.8rem;
		color: #777;
		margin: 0;
	}

	#out {
		margin-top: 0.5rem;
	}
</style>
</head>
<body>
<h2>ゲーム</h2>
<a class="link" href="https://puyoteto.pages.dev">ぷよテト</a>
<a class="link" href="https://school-escape.pages.dev">スクールエスケープ</a>

<h2>アプリ(Apps Script経由)</h2>
<p class="note">パスワードを入れてから押してください。</p>
<input id="password" type="password" placeholder="パスワード">
<button data-app="chat">chat</button>
<button data-app="othello">オセロ</button>
<div id="out"></div>

<script>
(function () {
	var ENDPOINT = "https://script.google.com/macros/s/AKfycbwL6u_n6E8waepb5sXQ-bT5E0qLkoaOv5sfpoQBURPDX7DaocyfcfN4vJ2HavEqFXbE/exec";

	function copyText(text) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(text);
			return;
		}
		var ta = document.createElement("textarea");
		ta.value = text;
		document.body.appendChild(ta);
		ta.select();
		try {
			document.execCommand("copy");
		} catch (e) {}
		document.body.removeChild(ta);
	}

	function loadApp(app) {
		document.getElementById("out").textContent = app + " を読み込み中…";

		fetch(ENDPOINT, {
			method: "POST",
			headers: { "Content-Type": "text/plain" },
			body: JSON.stringify({
				action: "getApp",
				app: app,
				password: document.getElementById("password").value,
			}),
		})
			.then((r) => r.json())
			.then((d) => {
				if (d.type !== "app-ok") {
					document.getElementById("out").textContent = "エラー: " + JSON.stringify(d);
					return;
				}

				var b = d.data.replace(/^data:.*;base64,/, "");

				try {
					var u = decodeURIComponent(
						atob(b)
							.split("")
							.map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
							.join("")
					);
					document.open();
					document.write(u);
					document.close();
				} catch (e) {
					document.getElementById("out").innerHTML = "<button id=cp>コピー</button>";
					document.getElementById("cp").addEventListener("click", () => {
						copyText("data:text/html;base64," + b);
					});
				}
			})
			.catch((err) => {
				document.getElementById("out").textContent = "通信エラー: " + err;
			});
	}

	document.querySelectorAll("button[data-app]").forEach((btn) => {
		btn.addEventListener("click", () => loadApp(btn.dataset.app));
	});
})();
</script>
</body>
</html>
