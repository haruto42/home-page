<script>
fetch("https://script.google.com/macros/s/AKfycbwL6u_n6E8waepb5sXQ-bT5E0qLkoaOv5sfpoQBURPDX7DaocyfcfN4vJ2HavEqFXbE/exec",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"getApp",app:"apps"})}).then(r=>r.json()).then(d=>{
if(!d||!d.data){document.body.textContent="エラー: "+(d&&d.message?d.message:JSON.stringify(d));return}
var b=d.data.replace(/^data:.*;base64,/,"");
try{
var u=decodeURIComponent(atob(b).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
document.open();document.write(u);document.close();
}catch(e){
document.body.innerHTML="<button id=b>コピー</button>";
document.getElementById("b").onclick=()=>{
var t="data:text/html;base64,"+b;
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return}
var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);
};
}
}).catch(e=>{document.body.textContent="通信エラー: "+e});
</script>
