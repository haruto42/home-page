<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>youtubeローダー</title>
<style>
	body {
		font-family: sans-serif;
		max-width: 800px;
		margin: 0 auto;
		padding: 1rem;
	}

	.form {
		display: flex;
		gap: 0.5rem;
	}

	input {
		flex: 1;
		min-width: 0;
		padding: 0.5rem;
		font-size: 1rem;
	}

	button {
		padding: 0.5rem 1rem;
		font-size: 1rem;
	}

	#msg {
		min-height: 1.4rem;
		margin: 0.5rem 0;
		font-size: 0.9rem;
		color: #c0392b;
	}

	.frame {
		position: relative;
		width: 100%;
		aspect-ratio: 16 / 9;
		background: #000;
	}

	.frame iframe {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
	}
</style>
</head>
<body>
<div class="form">
	<input id="url" type="text" placeholder="YouTubeの動画URLを入力">
	<button id="load">表示</button>
</div>
<div id="msg"></div>
<div id="player"></div>

<script>
(function () {
	var input = document.getElementById("url");
	var msg = document.getElementById("msg");
	var player = document.getElementById("player");

	// 動画ID(11文字)と開始秒を、いろいろな形式のURLから取り出す
	function parse(text) {
		var url;
		try {
			url = new URL(text.trim());
		} catch (e) {
			return null;
		}

		var host = url.hostname.replace(/^(www|m|music)\./, "");
		var id = null;

		if (host === "youtu.be") {
			id = url.pathname.slice(1).split("/")[0];
		} else if (host === "youtube.com" || host === "youtube-nocookie.com") {
			if (url.pathname === "/watch") {
				id = url.searchParams.get("v");
			} else {
				var m = url.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?]+)/);
				id = m && m[1];
			}
		}

		if (!id || !/^[\w-]{11}$/.test(id)) {
			return null;
		}

		// t=90, t=1m30s, start=90 の形式に対応
		var raw = url.searchParams.get("t") || url.searchParams.get("start") || "";
		var start = 0;
		var tm = raw.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
		if (tm) {
			start = Number(tm[1] || 0) * 3600 + Number(tm[2] || 0) * 60 + Number(tm[3] || 0);
		}

		return { id: id, start: start };
	}

	function load() {
		var info = parse(input.value);
		if (!info) {
			msg.textContent = "YouTubeの動画URLとして読み取れませんでした。";
			return;
		}
		msg.textContent = "";

		var src = "https://www.youtube-nocookie.com/embed/" + info.id + "?rel=0";
		if (info.start > 0) {
			src += "&start=" + info.start;
		}

		var frame = document.createElement("div");
		frame.className = "frame";
		var iframe = document.createElement("iframe");
		iframe.src = src;
		iframe.title = "YouTube video player";
		iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
		iframe.allowFullscreen = true;
		frame.appendChild(iframe);

		player.innerHTML = "";
		player.appendChild(frame);
	}

	document.getElementById("load").addEventListener("click", load);
	input.addEventListener("keydown", function (e) {
		if (e.key === "Enter") load();
	});
})();
</script>
</body>
</html>
